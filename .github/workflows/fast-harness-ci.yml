name: Fast Harness CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-library-portability:
    name: shared-library-portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-2022
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v7
        with:
          path: repos/emulebb-build-tests

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"

      - name: Install harness dependencies
        working-directory: repos/emulebb-build-tests
        run: python -m pip install -e .[dev]

      - name: Run portable shared-library fixture tests
        working-directory: repos/emulebb-build-tests
        run: python -m pytest tests/python/test_rust_shared_library_portability.py -q

  python-harness:
    name: python-harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025-vs2026

    steps:
      - name: Checkout test harness
        uses: actions/checkout@v7
        with:
          path: repos/emulebb-build-tests

      - name: Checkout app source
        uses: actions/checkout@v7
        with:
          repository: emulebb/emulebb
          ref: main
          path: workspaces/workspace/app/emulebb-main

      - name: Checkout stock source authority
        uses: actions/checkout@v7
        with:
          repository: irwir/eMule
          ref: ac3d52eafd88e9f6d9e0c2204c6dbead18db750b
          path: repos/emule-stock

      - name: Checkout stock instrumented authority
        uses: actions/checkout@v7
        with:
          repository: emulebb/emulebb
          ref: c547b7cf2b6b59d971600111e425330ec8d2944d
          path: workspaces/workspace/app/emulebb-community-baseline

      - name: Checkout frozen aMule authority
        uses: actions/checkout@v7
        with:
          repository: amule-org/amule
          ref: 02db0d7faecfc377694ff6242bc23346185990ed
          path: repos/amule-stable

      - name: Checkout aMule analysis authority
        uses: actions/checkout@v7
        with:
          repository: amule-org/amule
          ref: 8e2afa46b1a73177e6eff3a8a7a4ab6ce91a89ec
          path: repos/amule

      - name: Checkout tooling docs
        uses: actions/checkout@v7
        with:
          repository: emulebb/emulebb-tooling
          # Keep the beta API contract aligned with the tested Rust revision.
          ref: 47b7f686c871ecc18b9f2f2c306c014d7744e3ed
          path: repos/emulebb-tooling

      - name: Checkout build tooling
        uses: actions/checkout@v7
        with:
          repository: emulebb/emulebb-build
          path: repos/emulebb-build

      - name: Checkout Rust client
        uses: actions/checkout@v7
        with:
          repository: emulebb/emulebb-rust
          ref: 5c451cf3bbdb5f9b713f667c73f29591f9be2ece
          path: repos/emulebb-rust

      - name: Checkout upstream-clean ed2k-server dependency
        uses: actions/checkout@v7
        with:
          repository: emulebb/ed2k-server
          ref: 2af36de86368dde590abad980bcb5c92e9bce696
          path: repos/ed2k-server

      # The emulebb-miniupnpc-sys crate's build script compiles the bundled
      # MiniUPnP source from repos/third_party/emulebb-miniupnp/miniupnpc, so the
      # Rust cargo integration tests need that third-party source materialized.
      - name: Checkout MiniUPnP third-party source
        uses: actions/checkout@v7
        with:
          repository: emulebb/emulebb-miniupnp
          ref: miniupnpc-master-emule
          path: repos/third_party/emulebb-miniupnp

      # Cargo integration tests compile the PCP/NAT-PMP sys crate from the
      # workspace-owned native source tree at this canonical path.
      - name: Checkout PCP/NAT-PMP third-party source
        uses: actions/checkout@v7
        with:
          repository: emulebb/emulebb-libpcpnatpmp
          ref: a6e787f837e507336a8774522c33b54264ef4a4b
          path: repos/third_party/emulebb-libpcpnatpmp

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"

      - name: Prepare workspace output root
        shell: pwsh
        run: |
          $outputRoot = [System.IO.Path]::GetFullPath((Join-Path $env:EMULEBB_WORKSPACE_ROOT '..\emulebb-output'))
          $cargoTargetDir = [System.IO.Path]::GetFullPath((Join-Path $outputRoot 'builds\rust\target'))
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $cargoTargetDir | Out-Null
          "EMULEBB_WORKSPACE_OUTPUT_ROOT=$outputRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTargetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install harness dependencies
        working-directory: repos/emulebb-build-tests
        run: python -m pip install -e .[dev,live]

      - name: Check Rust OpenAPI metadata drift
        working-directory: repos/emulebb-build-tests
        run: python scripts/check-rust-openapi-routes.py

      - name: Run fast harness tests
        working-directory: repos/emulebb-build-tests
        run: python -m pytest
